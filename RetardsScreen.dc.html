<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  .rt * { box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; }
</style>
</helmet>
<div class="rt" style="width:100%; height:100%; overflow:hidden; background:#fff;">
 <div class="rt-scale" ref="{{ scaleRef }}" style="width:1440px; height:900px; transform-origin:top left; display:flex; flex-direction:column;">

  <!-- TOP BAR -->
  <div style="flex:none; height:58px; background:#232637; display:flex; align-items:center; justify-content:space-between; padding:0 22px;">
    <div style="display:flex; align-items:center; gap:36px;">
      <img src="assets/logo-full-white.png" alt="CinéPlanner" style="height:26px; width:auto; display:block;">
      <div style="display:flex; align-items:center; gap:6px; font:600 13px/1 'Inter';">
        <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="6">
          <span style="{{ t.style }}">{{ t.label }}</span>
        </sc-for>
      </div>
    </div>
    <div style="display:flex; align-items:center; gap:16px;">
      <span style="font:700 13px/1 'Inter'; letter-spacing:.03em; color:#eceef6;">CINÉ HORIZON · SIÈGE</span>
      <div style="width:31px; height:31px; border-radius:50%; background:linear-gradient(150deg,#6f63ff,#4536c9); display:flex; align-items:center; justify-content:center; color:#fff; font:700 12px/1 'Inter';">RH</div>
    </div>
  </div>

  <!-- CONTENU -->
  <div style="flex:1; min-height:0; padding:30px 34px; display:flex; flex-direction:column;">
    <div style="font:800 22px/1 'Inter'; color:#1c1f2e;">Retards</div>
    <div style="font:500 13px/1.4 'Inter'; color:#8a8da2; margin-top:6px;">Pointage a posteriori des arrivées tardives, par établissement.</div>

    <!-- filtres -->
    <div style="display:flex; align-items:flex-end; gap:16px; margin-top:22px;">
      <div><div style="font:600 12px/1 'Inter'; color:#4a4d61; margin-bottom:7px;">Cinéma</div><div style="width:260px; display:flex; align-items:center; justify-content:space-between; border:1px solid #dfe1ec; border-radius:9px; padding:11px 13px; font:600 13px/1 'Inter'; color:#1c1f2e;">Tous <span style="color:#9a9db2;">▾</span></div></div>
      <div><div style="font:600 12px/1 'Inter'; color:#4a4d61; margin-bottom:7px;">Depuis le</div><div style="width:190px; display:flex; align-items:center; justify-content:space-between; border:1px solid #dfe1ec; border-radius:9px; padding:11px 13px; font:600 13px/1 'Inter'; color:#9a9db2;">jj/mm/aaaa <span>📅</span></div></div>
      <span style="background:#4536c9; color:#fff; font:700 13px/1 'Inter'; padding:12px 20px; border-radius:9px;">Filtrer</span>
    </div>

    <!-- tableau -->
    <div style="margin-top:22px; border:1px solid #eceef6; border-radius:14px; overflow:hidden;">
      <div style="display:grid; grid-template-columns:1.5fr 1.4fr 1fr 0.8fr 0.9fr 0.9fr 1.3fr 1.3fr; background:#f7f8fc; border-bottom:1px solid #eceef6;">
        <sc-for list="{{ cols }}" as="c" hint-placeholder-count="8">
          <div style="padding:14px 16px; font:700 11px/1 'Inter'; letter-spacing:.07em; color:#8a8da2;">{{ c }}</div>
        </sc-for>
      </div>
      <sc-for list="{{ rows }}" as="r" hint-placeholder-count="9">
        <div style="{{ r.rowStyle }}">
          <div style="padding:15px 16px; font:600 13px/1.3 'Inter'; color:#4a4d61;">{{ r.cine }}</div>
          <div style="padding:15px 16px; font:700 13px/1.3 'Inter'; color:#1c1f2e;">{{ r.emp }}</div>
          <div style="padding:15px 16px; font:500 13px/1.3 'Inter'; color:#4a4d61;">{{ r.date }}</div>
          <div style="padding:15px 16px; font:500 13px/1.3 'Inter'; color:#8a8da2;">{{ r.prevu }}</div>
          <div style="padding:15px 16px; font:800 13px/1.3 'Inter'; color:#1c1f2e;">{{ r.arr }}</div>
          <div style="padding:15px 16px;"><span style="background:#fde3e6; color:#c0324a; font:700 11px/1 'Inter'; padding:6px 9px; border-radius:999px;">{{ r.retard }}</span></div>
          <div style="padding:15px 16px; font:500 13px/1.3 'Inter'; color:#4a4d61;">{{ r.poste }}</div>
          <div style="padding:15px 16px; font:500 13px/1.3 'Inter'; color:{{ r.noteColor }};">{{ r.note }}</div>
        </div>
      </sc-for>
    </div>
  </div>

 </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1040,&quot;height&quot;:600}}">
class Component extends DCLogic {
  _fit() {
    const inner = this._scaleEl;
    const box = inner && inner.parentElement;
    if (!inner || !box) return;
    const w = box.clientWidth, h = box.clientHeight;
    if (!w || !h) return;
    const s = w / 1440;
    inner.style.transform = 'scale(' + s + ')';
    inner.style.height = (h / s) + 'px';
  }
  componentWillUnmount() {
    if (this._ro) this._ro.disconnect();
    if (this._onResize) window.removeEventListener('resize', this._onResize);
  }
  renderVals() {
    const scaleRef = (el) => {
      if (!el || el === this._scaleEl) return;
      this._scaleEl = el;
      const run = () => this._fit();
      run(); requestAnimationFrame(run); setTimeout(run, 80);
      if (window.ResizeObserver) {
        if (this._ro) this._ro.disconnect();
        this._ro = new ResizeObserver(run);
        if (el.parentElement) this._ro.observe(el.parentElement);
      }
      if (!this._onResize) { this._onResize = run; window.addEventListener('resize', run); }
    };

    const tabLabels = ['Dashboard','Employés','Planning','Présences','Retards','Exports'];
    const tabs = tabLabels.map(l => ({
      label: l,
      style: l === 'Retards'
        ? "background:#5B4FE8; color:#fff; padding:8px 13px; border-radius:8px;"
        : "color:#c7c9d8; padding:8px 6px;"
    }));

    const cols = ['CINÉMA','EMPLOYÉ','DATE','PRÉVU','ARRIVÉE','RETARD','POSTE','NOTE'];
    const raw = [
      ['CINÉ HORIZON · MONTIGNY','Camille Renard','26/06/2026','19:00','19:07','+ 7 min','Renfort Soir','—',0],
      ['CINÉ HORIZON · MONTIGNY','Léo Mercier','26/06/2026','17:30','17:45','+ 15 min','Renfort Soir','—',0],
      ['CINÉ HORIZON · MONTIGNY','Camille Renard','17/06/2026','18:00','18:11','+ 11 min','Renfort Soir','—',0],
      ['CINÉ HORIZON · MONTIGNY','Lucie Bonnet','17/06/2026','17:30','17:38','+ 8 min','Renfort Soir','—',0],
      ['CINÉ HORIZON · ARCUEIL','Paul Girard','10/07/2026','13:00','18:40','+ 340 min','Agent d\u2019ouverture','aucune excuse',1],
      ['CINÉ HORIZON · ARCUEIL','Paul Girard','08/07/2026','13:15','13:25','+ 10 min','Agent d\u2019ouverture','pas d\u2019excuse',1],
      ['CINÉ HORIZON · MONTIGNY','Adrien Bollé','26/06/2026','13:30','13:40','+ 10 min','Renfort Jour','—',0],
      ['CINÉ HORIZON · MONTIGNY','Camille Renard','28/06/2026','10:30','10:45','+ 15 min','Renfort Matin','—',0],
      ['CINÉ HORIZON · SAINT-GELY','Eliott Rey','29/06/2026','13:00','13:10','+ 10 min','Ouverture','Trafic dense.',2]
    ];
    const rows = raw.map((r,i) => ({
      cine: r[0], emp: r[1], date: r[2], prevu: r[3], arr: r[4], retard: r[5], poste: r[6], note: r[7],
      noteColor: r[8] === 1 ? '#b06a2e' : r[8] === 2 ? '#8a8da2' : '#c7cad6',
      rowStyle: `display:grid; grid-template-columns:1.5fr 1.4fr 1fr 0.8fr 0.9fr 0.9fr 1.3fr 1.3fr; border-top:1px solid #f0f1f7; background:${i % 2 ? '#fbfbfe' : '#fff'};`
    }));

    return { scaleRef, tabs, cols, rows };
  }
}
</script>
</body>
</html>
