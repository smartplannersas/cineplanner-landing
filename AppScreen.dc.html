<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
/* Polices auto-hebergees : aucun appel a Google, aucun transfert de donnees visiteur. */
@font-face {
  font-family: 'Inter';
  font-style: normal;
  font-weight: 400 900;
  font-display: swap;
  src: url('/assets/fonts/inter-latin-ext.woff2') format('woff2');
  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
}
@font-face {
  font-family: 'Inter';
  font-style: normal;
  font-weight: 400 900;
  font-display: swap;
  src: url('/assets/fonts/inter-latin.woff2') format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}

  .aps-root * { box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; }

  /* Écrans sans capture JPEG (ccn, demandes) : rien à montrer sous 640px.
     On escamote aussi le conteneur de la page — qui impose sa hauteur et
     laisserait un trou — via :has(), sans avoir à toucher aux sept pages. */
  @media (max-width: 640px) {
    .aps-vide { display: none !important; }
    div:has(> .aps-vide) { display: none !important; }
  }
</style>
</helmet>
<div class="{{ rootClasse }}" style="width:100%; height:100%; min-height:360px; background:transparent; border-radius:14px; overflow:hidden; position:relative; container-type:size;">

  <!-- DESKTOP : capture produit réelle dans une fenêtre navigateur -->
  <sc-if value="{{ isBrowserFrame }}" hint-placeholder-val="{{ true }}">
  <div style="width:100%; height:100%; display:flex; flex-direction:column; background:#fff;">
    <div style="flex:none; height:38px; background:#eceef4; display:flex; align-items:center; gap:14px; padding:0 14px; border-bottom:1px solid #e2e5ee;">
      <div style="display:flex; gap:7px;"><span style="width:11px; height:11px; border-radius:50%; background:#ff5f57;"></span><span style="width:11px; height:11px; border-radius:50%; background:#febc2e;"></span><span style="width:11px; height:11px; border-radius:50%; background:#28c840;"></span></div>
      <div style="flex:1; max-width:340px; background:#fff; border:1px solid #dfe2ec; border-radius:8px; height:22px; display:flex; align-items:center; padding:0 10px; font:500 11px/1 'Inter'; color:#8a8aa4;">🔒 app.cineplanner.fr/{{ urlPath }}</div>
    </div>
    <div style="flex:1; min-height:0; position:relative; overflow:hidden;">
      <img src="{{ shot }}" alt="Ciné Planner" style="width:100%; height:100%; object-fit:cover; object-position:{{ shotPos }}; display:block;">
    </div>
  </div>
  </sc-if>

  <!-- MOBILE : capture d'écran réelle, recadrée comme une image.
       Sous 640px la maquette HTML est inexploitable : conçue pour 1360px, elle
       tombe à l'échelle 0,25 dans un conteneur de 331px, soit 4px de texte. La
       rogner assez pour être lisible ne montre plus qu'un quart de l'interface,
       tranchée en plein tableau. On sert donc la capture JPEG, recadrée par
       object-position : un cadrage d'image se lit comme un choix graphique,
       pas comme une interface coupée. -->
  <sc-if value="{{ isImageMobile }}" hint-placeholder-val="{{ false }}">
  <div style="width:100%; height:100%; border-radius:14px; overflow:hidden; background:#fff; border:1px solid #e9e9f2; box-shadow:0 20px 44px -26px rgba(22,22,42,.45);">
    <img src="{{ shotMobile }}" alt="Ciné Planner" style="width:100%; height:100%; object-fit:cover; object-position:{{ shotPosMobile }}; display:block;">
  </div>
  </sc-if>

  <!-- LAPTOP PC (ratio fixe, contain — jamais déformé ni rogné) -->
  <sc-if value="{{ isLaptop }}" hint-placeholder-val="{{ false }}">
  <div style="width:100%; height:100%; display:flex; align-items:center; justify-content:center;">
   <div style="width:min(98cqw, 94cqh * 1.42); aspect-ratio:1.42; display:flex; flex-direction:column; align-items:center;">
    <!-- écran -->
    <div style="width:90%; flex:1; min-height:0; background:linear-gradient(155deg,#20222e,#0a0b11); border-radius:18px 18px 5px 5px; padding:12px 12px 14px; box-shadow:0 30px 55px -26px rgba(22,22,42,.6), inset 0 0 0 1px rgba(255,255,255,.07); position:relative;">
      <div style="position:absolute; top:6px; left:50%; transform:translateX(-50%); width:5px; height:5px; border-radius:50%; background:#3a3d4d; box-shadow:inset 0 0 0 1px rgba(255,255,255,.15);"></div>
      <div style="height:100%; border-radius:5px; overflow:hidden; background:#fff; box-shadow:inset 0 0 0 1px rgba(0,0,0,.05);">
        <sc-if value="{{ isPlanningHtml }}" hint-placeholder-val="{{ false }}">
          <dc-import name="PlanningScreen" modal="{{ planModal }}" base="{{ planBase }}" hint-size="100%,100%" style="width:100%;height:100%;"></dc-import>
        </sc-if>
        <sc-if value="{{ isRetardsHtml }}" hint-placeholder-val="{{ false }}">
          <dc-import name="TempsScreen" hint-size="100%,100%" style="width:100%;height:100%;"></dc-import>
        </sc-if>
        <sc-if value="{{ isContratHtml }}" hint-placeholder-val="{{ false }}">
          <dc-import name="ContratScreen" hint-size="100%,100%" style="width:100%;height:100%;"></dc-import>
        </sc-if>
        <sc-if value="{{ isDocsHtml }}" hint-placeholder-val="{{ false }}">
          <dc-import name="DocumentsScreen" hint-size="100%,100%" style="width:100%;height:100%;"></dc-import>
        </sc-if>
        <sc-if value="{{ isCcnHtml }}" hint-placeholder-val="{{ false }}">
          <dc-import name="CCNScreen" hint-size="100%,100%" style="width:100%;height:100%;"></dc-import>
        </sc-if>
        <sc-if value="{{ isDemandesHtml }}" hint-placeholder-val="{{ false }}">
          <dc-import name="DemandesScreen" view="{{ demandesView }}" hint-size="100%,100%" style="width:100%;height:100%;"></dc-import>
        </sc-if>
        <sc-if value="{{ notPlanningHtml }}" hint-placeholder-val="{{ true }}">
          <img src="{{ shot }}" alt="Ciné Planner" style="width:100%; height:100%; object-fit:cover; object-position:{{ shotPos }}; display:block;">
        </sc-if>
      </div>
    </div>
    <!-- socle / charnière -->
    <div style="position:relative; width:100%; height:22px; flex:none; background:linear-gradient(180deg,#eceef4 0%,#c7cad6 45%,#aeb2c1 100%); clip-path:polygon(4% 0, 96% 0, 100% 74%, 50% 100%, 0 74%); border-radius:0 0 10px 10px; box-shadow:0 16px 22px -12px rgba(22,22,42,.5);">
      <div style="position:absolute; top:0; left:50%; transform:translateX(-50%); width:132px; height:8px; background:linear-gradient(180deg,#9a9fb0,#b7bbc9); border-radius:0 0 11px 11px;"></div>
    </div>
   </div>
  </div>
  </sc-if>

  <!-- BARE : écran HTML plein cadre (pour la loupe/zoom) -->
  <sc-if value="{{ isBare }}" hint-placeholder-val="{{ false }}">
  <div style="width:100%; height:100%; overflow:hidden; background:#fff;">
    <sc-if value="{{ isPlanningHtml }}" hint-placeholder-val="{{ false }}"><dc-import name="PlanningScreen" modal="{{ planModal }}" base="{{ planBase }}" hint-size="100%,100%" style="width:100%;height:100%;"></dc-import></sc-if>
    <sc-if value="{{ isRetardsHtml }}" hint-placeholder-val="{{ false }}"><dc-import name="TempsScreen" hint-size="100%,100%" style="width:100%;height:100%;"></dc-import></sc-if>
    <sc-if value="{{ isContratHtml }}" hint-placeholder-val="{{ false }}"><dc-import name="ContratScreen" hint-size="100%,100%" style="width:100%;height:100%;"></dc-import></sc-if>
    <sc-if value="{{ isDocsHtml }}" hint-placeholder-val="{{ false }}"><dc-import name="DocumentsScreen" hint-size="100%,100%" style="width:100%;height:100%;"></dc-import></sc-if>
    <sc-if value="{{ isCcnHtml }}" hint-placeholder-val="{{ false }}"><dc-import name="CCNScreen" hint-size="100%,100%" style="width:100%;height:100%;"></dc-import></sc-if>
    <sc-if value="{{ isDemandesHtml }}" hint-placeholder-val="{{ false }}"><dc-import name="DemandesScreen" view="{{ demandesView }}" hint-size="100%,100%" style="width:100%;height:100%;"></dc-import></sc-if>
  </div>
  </sc-if>

  <!-- MOBILE / PORTAIL : appli salarié, vue jour -->
  <sc-if value="{{ isPortail }}" hint-placeholder-val="{{ false }}">
  <div style="width:100%; height:100%; background:linear-gradient(160deg,#eceafd,#f5f6fc); display:flex; align-items:center; justify-content:center; overflow:hidden;">
   <div ref="{{ phoneRef }}" style="width:300px; height:624px; flex:none; transform-origin:center center;">
    <div style="width:100%; height:100%; background:#0b0b0f; border-radius:46px; padding:11px; box-shadow:0 26px 54px -20px rgba(22,22,42,.55);">
      <div style="width:100%; height:100%; background:#fff; border-radius:34px; overflow:hidden; display:flex; flex-direction:column; position:relative;">
        <div style="position:absolute; top:8px; left:50%; transform:translateX(-50%); width:80px; height:22px; background:#0b0b0f; border-radius:999px; z-index:5;"></div>
        <!-- barre appli -->
        <div style="background:#232637; padding:26px 14px 12px; display:flex; align-items:center; justify-content:space-between;">
          <div style="display:flex; align-items:center; gap:7px;"><div style="width:20px; height:20px; border-radius:5px; background:#fff; display:flex; align-items:center; justify-content:center; font:800 10px/1 'Inter'; color:#232637;">31</div><span style="font:800 11px/1 'Inter'; color:#fff; letter-spacing:.02em;">CINÉ HORIZON · BORDEAUX</span></div>
          <span style="color:#c7c9d8; font-size:11px;">🔔</span>
        </div>
        <div style="flex:1; min-height:0; overflow:hidden; display:flex; flex-direction:column;">
          <!-- nav jour -->
          <div style="display:flex; align-items:center; justify-content:space-between; padding:12px 13px 8px;">
            <span style="border:1px solid #e2e4ef; border-radius:8px; padding:7px 11px; font:600 11px/1 'Inter'; color:#4a4d61;">‹ Aujourd'hui ›</span>
            <span style="border:1.5px solid #5B4FE8; border-radius:8px; padding:7px 10px; font:600 11px/1 'Inter'; color:#5B4FE8;">Jour ▾</span>
          </div>
          <div style="padding:2px 14px;"><div style="font:800 14px/1.2 'Inter'; color:#16162a;">Jeudi 16 juillet 2026</div><div style="font:500 11px/1 'Inter'; color:#8a8aa4; margin-top:3px;">Semaine 29</div></div>
          <div style="padding:12px 13px 0; display:flex; flex-direction:column; gap:9px; overflow:hidden;">
            <div style="font:700 9px/1 'Inter'; letter-spacing:.1em; color:#9a9db2;">ABSENCES</div>
            <div style="background:#fdecd6; color:#a95a1e; border-radius:9px; padding:10px 12px; font:700 12px/1 'Inter';">Maladie</div>
            <sc-for list="{{ mobileDay }}" as="g" hint-placeholder-count="3">
              <div style="font:700 9px/1 'Inter'; letter-spacing:.1em; color:#9a9db2; margin-top:3px;">{{ g.role }}</div>
              <sc-for list="{{ g.items }}" as="it" hint-placeholder-count="2">
                <div style="{{ it.style }}"><div style="font:800 12px/1.2 'Inter';">{{ it.name }}</div><div style="font:600 11px/1 'Inter'; opacity:.85; margin-top:4px;">{{ it.time }}</div></div>
              </sc-for>
            </sc-for>
          </div>
        </div>
      </div>
    </div>
   </div>
  </div>
  </sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:900,&quot;height&quot;:560},&quot;screen&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;planning&quot;,&quot;temps&quot;,&quot;contrats&quot;,&quot;paie&quot;,&quot;portail&quot;],&quot;default&quot;:&quot;planning&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;frame&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;browser&quot;,&quot;laptop&quot;],&quot;default&quot;:&quot;browser&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  componentWillUnmount() { if (this._ro) this._ro.disconnect(); if (this._onResize) window.removeEventListener('resize', this._onResize); }
  renderVals() {
    const s = this.props.screen || 'planning';
    const shots = {
      planning: { src: '/assets/shot-planning.jpg', pos: 'left top', url: 'planning' },
      temps: { src: '/assets/shot-temps.jpg', pos: 'left top', url: 'planning/jour' },
      contrats: { src: '/assets/shot-contrats.jpg', pos: 'left top', url: 'contrats' },
      paie: { src: '/assets/shot-paie.jpg', pos: 'center top', url: 'equipe/export' },
      presences: { src: '/assets/shot-presences.jpg', pos: 'left top', url: 'presences' }
    };
    const shot = shots[s] || shots.planning;
    const isDesktop = s !== 'portail';
    // Sous 640px on ne montre plus la maquette HTML mais la capture JPEG, quand
    // elle existe. Les écrans sans capture — ccn, demandes — n'affichent rien :
    // mieux vaut un vide qu'une interface tranchée. La règle .aps-vide du helmet
    // escamote aussi le conteneur de la page, sinon il resterait un trou.
    const petitEcran = typeof window !== 'undefined' && !!window.matchMedia
      && window.matchMedia('(max-width: 640px)').matches;
    // Un écran sans capture propre peut emprunter celle de sa fonctionnalité.
    // « demandes » illustre l'onglet Suivi des temps de l'accueil : sans cela
    // l'onglet serait le seul dépourvu d'illustration sur téléphone.
    // « ccn » n'emprunte rien : aucune capture ne montre les règles de
    // convention collective, et en afficher une autre induirait en erreur.
    const captureEmpruntee = { demandes: shots.temps };
    const captureMobile = shots[s] || captureEmpruntee[s] || null;
    const aUneCapture = !!captureMobile;

    const isBare = this.props.frame === 'bare';
    const laptopDemande = isDesktop && this.props.frame === 'laptop';
    const isLaptop = laptopDemande && !petitEcran;
    const isImageMobile = laptopDemande && petitEcran && aUneCapture;
    const videMobile = laptopDemande && petitEcran && !aUneCapture;
    const htmlEnv = isLaptop || isBare;

    // Recadrage de la capture sur mobile : on vise la zone la plus parlante de
    // chaque écran, en gardant le haut à gauche là où l'interface commence.
    const posMobile = {
      planning: 'left top', temps: 'left top', contrats: 'left top',
      paie: 'center top', presences: 'left top', demandes: 'left top'
    };
    if (!this._phoneRef) {
      this._phoneRef = (el) => {
        if (!el) return;
        this._phoneEl = el;
        const fit = () => {
          const box = el.parentElement; if (!box) return;
          const w = box.clientWidth, h = box.clientHeight; if (!w || !h) return;
          const s = Math.min(w / 300, h / 624);
          el.style.transform = 'scale(' + s + ')';
        };
        fit(); requestAnimationFrame(fit); setTimeout(fit, 80);
        if (window.ResizeObserver) { if (this._ro) this._ro.disconnect(); this._ro = new ResizeObserver(fit); if (el.parentElement) this._ro.observe(el.parentElement); }
        if (!this._onResize) { this._onResize = fit; window.addEventListener('resize', fit); }
      };
    }
    const phoneRef = this._phoneRef;
    return {
      isDesktop,
      isLaptop,
      phoneRef,
      isBrowserFrame: isDesktop && !isLaptop && !isBare,
      isPortail: s === 'portail',
      isImageMobile,
      shotMobile: captureMobile ? captureMobile.src : '',
      shotPosMobile: posMobile[s] || 'left top',
      isDemandesHtml: htmlEnv && s === 'demandes',
      demandesView: this.props.view || 'rectif',
      rootClasse: videMobile ? 'aps-root aps-vide' : 'aps-root',
      isBare,
      isPlanningHtml: htmlEnv && (s === 'planning' || s === 'paie'),
      isRetardsHtml: htmlEnv && s === 'temps',
      isContratHtml: htmlEnv && s === 'contrats',
      isDocsHtml: htmlEnv && s === 'presences',
      isCcnHtml: htmlEnv && s === 'ccn',
      planModal: this.props.modal,
      planBase: this.props.base,
      notPlanningHtml: !(isLaptop && (s === 'planning' || s === 'temps' || s === 'contrats' || s === 'paie' || s === 'presences' || s === 'ccn')),
      shot: shot.src,
      shotPos: shot.pos,
      urlPath: shot.url,
      mobileShifts: [
        { day: 'Mer 4 juin', time: '10:30 – 18:15' },
        { day: 'Ven 6 juin', time: '13:30 – 22:30' },
        { day: 'Sam 7 juin', time: '13:00 – 18:30' }
      ],
      mobileDay: [
        { role: 'ENCADREMENT', items: [
          { name: 'Camille Renard', time: '10:00 – 17:00', style: "background:#f57c1f; color:#fff; border-radius:10px; padding:11px 13px;" }
        ]},
        { role: 'AGENT D\u2019ACCUEIL', items: [
          { name: 'Adrien Bollé', time: '17:00 – 22:30', style: "background:#c9edb4; color:#2f5a1c; border-radius:10px; padding:11px 13px;" },
          { name: 'Léna Marchal', time: '13:30 – 23:30', style: "background:#ffe6c2; color:#8a5510; border-radius:10px; padding:11px 13px;" },
          { name: 'Sarah Dubois', time: '18:30 – 23:00', style: "background:#f7a9a9; color:#7a2222; border-radius:10px; padding:11px 13px;" },
          { name: 'Jeanne Morel', time: '17:00 – 22:30', style: "background:#a9c9ff; color:#1f3f77; border-radius:10px; padding:11px 13px;" }
        ]},
        { role: 'PROJECTION', items: [
          { name: 'Stéphane Petit', time: '18:00 – 00:30', style: "background:#9fe0b0; color:#12563a; border-radius:10px; padding:11px 13px;" }
        ]}
      ]
    };
  }
}
</script>
</body>
</html>
