<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Merci — Ciné Planner</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/png" href="./assets/logo-mark.png">
<meta name="theme-color" content="#5B4FE8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="./checkout-embed.js"></script>
</head>
<body style="margin:0; background:#f5f6fc; font-family:'Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased;">

<div style="display:flex; align-items:center; justify-content:space-between; padding:20px 40px; background:#fff; border-bottom:1px solid #eef0f7;">
  <a href="./index.html" style="display:flex; align-items:center;"><img src="./assets/logo-full.png" alt="Ciné Planner" style="height:46px; width:auto; display:block;"></a>
  <a href="./index.html" style="font:600 14px/1 'Inter'; color:#7a7a92; text-decoration:none;">← Retour au site</a>
</div>

<div style="max-width:640px; margin:0 auto; padding:72px 24px 96px; text-align:center;">
  <div id="pastille" style="width:64px; height:64px; margin:0 auto; border-radius:50%; background:#e6f7ef; color:#22a06b; display:flex; align-items:center; justify-content:center;">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"></polyline></svg>
  </div>
  <h1 id="titre" style="font:800 clamp(28px,4vw,38px)/1.2 'Inter'; letter-spacing:-.02em; color:#16162a; margin:26px 0 0;">Merci, votre abonnement est confirmé</h1>
  <p id="texte" style="font:400 17px/1.65 'Inter'; color:#5c5c72; margin:18px 0 0;">Vous allez recevoir votre facture par email. Un expert Ciné Planner vous contacte sous 24 h ouvrées pour paramétrer vos établissements et la convention collective.</p>

  <div style="display:flex; flex-wrap:wrap; justify-content:center; gap:12px; margin-top:34px;">
    <a href="https://app.cineplanner.fr" style="background:#5B4FE8; color:#fff; font:700 15px/1 'Inter'; padding:15px 24px; border-radius:12px; text-decoration:none;">Accéder à mon espace</a>
    <a href="./index.html" style="border:1px solid #d8d8e6; color:#16162a; font:700 15px/1 'Inter'; padding:15px 24px; border-radius:12px; text-decoration:none;">Revenir au site</a>
  </div>
</div>

<script>
/* Stripe renvoie ici après le paiement. On demande au Worker l'état réel de la session :
   sans cette vérification, la page affirmerait « confirmé » même si le paiement a échoué. */
(function () {
  var id = new URLSearchParams(location.search).get('session_id');
  var endpoint = window.CP_CHECKOUT_ENDPOINT;
  if (!id || !endpoint) return;   // arrivée directe, ou Worker pas encore déployé

  fetch(endpoint + '?session_id=' + encodeURIComponent(id))
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d.paiement === 'paid' || d.statut === 'complete') return;   // message par défaut : correct
      document.getElementById('pastille').setAttribute('style', 'width:64px; height:64px; margin:0 auto; border-radius:50%; background:#fdeceb; color:#d5372b; display:flex; align-items:center; justify-content:center; font:800 30px/1 Inter;');
      document.getElementById('pastille').textContent = '!';
      document.getElementById('titre').textContent = "Le paiement n'a pas abouti";
      document.getElementById('texte').textContent = "Aucun montant n'a été prélevé. Vous pouvez réessayer depuis la page Abonnement, ou nous écrire à contact@cineplanner.fr si le problème persiste.";
    })
    .catch(function () { /* le message par défaut reste affiché */ });
})();
</script>
</body>
</html>
